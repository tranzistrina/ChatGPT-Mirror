<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChatGPT Mirror • LAN</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main class="shell">
<header><div><h1>ChatGPT Mirror</h1><small id="mode">accessToken • LAN</small></div>
<nav><button id="language" type="button">English</button><a href="/admin/" id="admin">Панель управления</a></nav></header>
<section id="login" class="login" hidden><h2 id="login_title">Вход в чат</h2>
<p id="login_text">Войди через локальную панель и выбери назначенный ChatGPT-аккаунт. Клиенту доступ в интернет не нужен.</p>
<a class="button" href="/admin/" id="login_link">Перейти к входу</a></section>
<section id="chat" hidden><div id="messages" class="messages" role="log" aria-live="polite"></div>
<form id="chatform"><label id="label" for="prompt">Сообщение</label>
<textarea id="prompt" rows="3" maxlength="6000" placeholder="Напишите сообщение..." required></textarea>
<div class="controls"><span id="status" role="status"></span><button type="button" id="new">Новый чат</button>
<button id="send" type="submit">Отправить</button></div></form></section>
</main></body></html>

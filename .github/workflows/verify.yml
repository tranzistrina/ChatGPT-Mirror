name: Verify admin frontend and backend
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: chatgpt-mirror-verify
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020b
        with:
          node-version: '22'
      - name: Build Vue admin frontend
        run: cd frontend && npm ci --ignore-scripts && npm run build
  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_ENV: PRODUCTION
      DJANGO_SECRET_KEY: ci-test-only-temporary-not-used-in-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-password-not-a-live-secret
      CHATGPT_GATEWAY_URL: http://127.0.0.1:8787
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check Django and run security regression tests
        run: |
          python3 -m pip install -r backend/requirements.txt
          cd backend
          python3 -m py_compile ../scripts/patch_upstream.py
          python3 manage.py check
          python3 manage.py test app.accounts.tests_security

  lan-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate LAN env generation and Docker compose
        run: |
          python3 scripts/setup_lan_env.py
          python3 - <<'PY'
          import os
          from pathlib import Path
          env = Path('.env.lan').read_text()
          assert 'REPLACE_WITH' not in env
          assert 'DJANGO_SECRET_KEY=' in env
          assert 'ADMIN_PASSWORD=' in env
          assert not (os.stat('.env.lan').st_mode & 0o077)
          PY
          docker compose --env-file .env.lan -f docker-compose.lan.yml config --quiet
          python3 -m py_compile scripts/setup_lan_env.py

  browser-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate password-protected standalone HTTPS Chromium relay
        run: |
          python3 -m unittest discover -s tests -p 'test_browser_relay.py' -v
          python3 scripts/setup_browser_relay.py
          docker compose --env-file .env.browser-relay -f docker-compose.browser-relay.yml config --quiet
          docker compose --env-file .env.browser-relay -f docker-compose.browser-relay.yml config --format json > /tmp/browser-relay.json
          python3 - <<'PY'
          import json
          conf = json.load(open('/tmp/browser-relay.json'))
          assert len(conf['services']) == 1
          service = conf['services']['browser']
          assert service['image'] == 'lscr.io/linuxserver/chromium:latest'
          assert service['environment']['CUSTOM_USER'] == 'mirror'
          assert len(service['environment']['PASSWORD']) >= 30
          assert service['environment']['HARDEN_DESKTOP'] == 'true'
          ports = service['ports']
          assert len(ports) == 1, ports
          assert ports[0]['host_ip'] == '192.168.0.100', ports
          assert ports[0]['published'] == '50002', ports
          assert ports[0]['target'] == 3001, ports
          assert 'privileged' not in service or not service['privileged']
          print('Standalone HTTPS + auth + expected LAN port: OK')
          PY

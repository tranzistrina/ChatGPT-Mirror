# Local-only macOS stack: all running application code is open-source.
# docker compose --env-file .env.docker -f docker-compose.mac.yml up -d --build
name: chatgpt-mirror-mac

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatgpt-mirror-local:mac
    environment:
      DJANGO_ENV: PRODUCTION
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env.docker}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env.docker}
      ALLOW_REGISTER: ${ALLOW_REGISTER:-false}
      SHOW_GITHUB: ${SHOW_GITHUB:-false}
      TZ: ${TZ:-UTC}
      CHATGPT_GATEWAY_URL: http://gateway:8787
    ports:
      - "127.0.0.1:50002:50002"
    depends_on:
      - gateway
    volumes:
      - mirror_db:/app/backend/db
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: chatgpt-mirror-openai-gateway:local
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      GATEWAY_ACCESS_PASSWORD: ${GATEWAY_ACCESS_PASSWORD:?Set GATEWAY_ACCESS_PASSWORD in .env.docker}
      GATEWAY_ALLOWED_ORIGINS: ${GATEWAY_ALLOWED_ORIGINS:-http://127.0.0.1:50002,http://localhost:50002}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    # Deliberately no ports: only the web container can reach the gateway.

volumes:
  mirror_db:
